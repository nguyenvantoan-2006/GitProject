<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng thẻ hình ảnh trong HTML</title>
</head>
<body>

    <h1>Hình ảnh yêu thích của tôi</h1>

    <!-- 
      - Thẻ <img> dùng để hiển thị hình ảnh
      - src: đường dẫn ảnh
      - alt: văn bản thay thế mô tả nội dung ảnh
      - width: điều chỉnh kích thước ảnh hiển thị vừa vặn
    -->
    <img 
        src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" 
        alt="Bãi biển nhiệt đới cát trắng với hàng dừa xanh và làn nước biển trong vắt" 
        width="600"
    >

</body>
</html>
