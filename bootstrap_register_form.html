<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - Bootstrap Forms</title>
    <!-- Nhúng Bootstrap 5 CSS qua CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <!-- Thẻ Card bao bọc Form -->
                <div class="card shadow-sm border-0 rounded-3 p-4 p-md-5 bg-white">
                    
                    <!-- Tiêu đề Form -->
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">Tạo Tài Khoản</h2>
                        <p class="text-muted small">Vui lòng điền đầy đủ các thông tin bên dưới để đăng ký</p>
                    </div>

                    <form action="#" method="POST">
                        
                        <!-- 1. Họ và tên -->
                        <div class="mb-3">
                            <label for="fullname" class="form-label fw-semibold">Họ và tên</label>
                            <input type="text" class="form-control" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required>
                        </div>

                        <!-- 2. Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Địa chỉ Email</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                            <div class="form-text text-muted">Chúng tôi cam kết bảo mật địa chỉ email của bạn.</div>
                        </div>

                        <!-- 3. Mật khẩu -->
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu..." required>
                        </div>

                        <!-- 4. Xác nhận mật khẩu -->
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label fw-semibold">Xác nhận mật khẩu</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Nhập lại mật khẩu..." required>
                        </div>

                        <!-- 5. Giới tính (Radio buttons) -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold d-block">Giới tính</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                                <label class="form-check-label" for="genderMale">Nam</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                                <label class="form-check-label" for="genderFemale">Nữ</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                                <label class="form-check-label" for="genderOther">Khác</label>
                            </div>
                        </div>

                        <!-- 6. Sở thích (Checkboxes) -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold d-block">Sở thích</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyCoding" name="hobby" value="coding" checked>
                                <label class="form-check-label" for="hobbyCoding">Lập trình</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyMusic" name="hobby" value="music">
                                <label class="form-check-label" for="hobbyMusic">Âm nhạc</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyTravel" name="hobby" value="travel">
                                <label class="form-check-label" for="hobbyTravel">Du lịch</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbySports" name="hobby" value="sports">
                                <label class="form-check-label" for="hobbySports">Thể thao</label>
                            </div>
                        </div>

                        <!-- 7. Quốc gia (Dropdown Select) -->
                        <div class="mb-4">
                            <label for="country" class="form-label fw-semibold">Quốc gia</label>
                            <select class="form-select" id="country" name="country" required>
                                <option value="" selected disabled>-- Chọn quốc gia --</option>
                                <option value="VN">Việt Nam</option>
                                <option value="US">Hoa Kỳ</option>
                                <option value="JP">Nhật Bản</option>
                                <option value="KR">Hàn Quốc</option>
                                <option value="SG">Singapore</option>
                            </select>
                        </div>

                        <!-- 8. Nút Submit -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm">Đăng Ký Ngay</button>
                        </div>

                    </form>

                    <!-- Chân trang liên kết -->
                    <div class="text-center mt-4">
                        <small class="text-muted">Đã có tài khoản? <a href="#" class="text-decoration-none fw-semibold">Đăng nhập</a></small>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng Bootstrap 5 JS Bundle qua CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
