<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xây dựng bố cục với Mô hình hộp CSS</title>
    <!-- Đổi từ style.css sang style_1.css -->
    <link rel="stylesheet" href="style_1.css">
</head>
<body>

    <!-- Container chứa 3 thẻ card -->
    <div class="card">
        <h3>Card 1 (content-box)</h3>
        <p>Kích thước bị phình to do padding và border được cộng thêm vào ngoài width/height đã đặt.</p>
    </div>

    <div class="card">
        <h3>Card 2 (border-box)</h3>
        <p>Kích thước giữ chuẩn đúng 280px x 150px bao gồm cả padding và border.</p>
    </div>

    <div class="card">
        <h3>Card 3 (border-box)</h3>
        <p>Kích thước tương tự Card 2, màu nền đỏ giúp phân biệt rõ ràng.</p>
    </div>

</body>
</html>
