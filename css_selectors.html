<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng bộ chọn CSS</title>
    <!-- Liên kết file CSS -->
    <link rel="stylesheet" href="selectors_style.css">
</head>
<body>

    <!-- Tiêu đề h1 -->
    <h1>Trang web của tôi</h1>

    <!-- Đoạn văn mô tả bản thân -->
    <p class="bio-desc">
        Xin chào! Tôi là một học viên đam mê lập trình web và đang tìm hiểu các kỹ thuật định dạng giao diện với CSS.
    </p>

    <!-- Danh sách 3 sở thích với màu sắc khác nhau -->
    <ul id="hobbies-list">
        <li class="hobby-coding">Lập trình ứng dụng web</li>
        <li class="hobby-music">Nghe nhạc không lời khi viết code</li>
        <li class="hobby-travel">Đi du lịch khám phá địa điểm mới</li>
    </ul>

    <!-- Nút bấm với hover effect -->
    <div class="button-container">
        <button id="my-button" type="button">Nhấn vào đây</button>
    </div>

</body>
</html>
