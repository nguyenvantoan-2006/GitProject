<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS Flex Grow</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            padding: 30px;
            background-color: #f8fafc;
            color: #1e293b;
        }

        h2 {
            margin-bottom: 6px;
            color: #0f172a;
        }

        p.desc {
            margin-bottom: 16px;
            color: #64748b;
            font-size: 14px;
        }

        .section-box {
            background: #ffffff;
            padding: 24px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        /* Container Flexbox chứa 5 phần tử */
        .flex-container {
            display: flex;
            width: 100%;
            max-width: 800px;
            gap: 12px;
            background-color: #f1f5f9;
            padding: 16px;
            border-radius: 6px;
            border: 1px dashed #cbd5e1;
        }

        /* Các item thông thường (mặc định flex-grow: 0) */
        .item {
            background-color: lightblue;
            color: #0369a1;
            padding: 25px 20px;
            text-align: center;
            font-weight: bold;
            border-radius: 4px;
            width: 100px; /* Chiều rộng ban đầu */
            flex-shrink: 0;
        }

        /* Item 2 được thiết lập flex-grow: 1 hoặc lớn hơn */
        .item-grow {
            flex-grow: 1; /* Chiếm trọn toàn bộ khoảng trống còn dư trong container */
            background-color: #38bdf8;
            color: #0c4a6e;
            border: 2px solid #0284c7;
        }
    </style>
</head>
<body>

    <div class="section-box">
        <h2>Thực hành thuộc tính flex-grow với 5 Flex Items</h2>
        <p class="desc">
            Vùng chứa gồm 5 khối div. Div thứ 2 được áp dụng <code>flex-grow: 1</code> nên sẽ mở rộng tối đa để lấp đầy toàn bộ phần không gian còn lại so với 4 div còn lại.
        </p>

        <div class="flex-container">
            <div class="item">Div 1</div>
            <div class="item item-grow">Div 2 (flex-grow: 1)</div>
            <div class="item">Div 3</div>
            <div class="item">Div 4</div>
            <div class="item">Div 5</div>
        </div>
    </div>

</body>
</html>
