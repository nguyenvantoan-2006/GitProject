<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố cục bằng Float và Clear</title>
    <!-- Liên kết tới file CSS -->
    <link rel="stylesheet" href="float_style.css">
</head>
<body>

    <h2 style="margin-bottom: 15px; color: #1e293b;">Bố cục hai cột sử dụng Float và Clear</h2>

    <div class="container">
        <div class="left-column">
            <h3>Cột bên trái (60%)</h3>
            <p>Đây là cột chứa nội dung chính của trang web. Phần tử này được áp dụng thuộc tính <code>float: left</code>.</p>
        </div>
        <div class="right-column">
            <h3>Cột bên phải (38%)</h3>
            <p>Đây là cột sidebar. Phần tử này được áp dụng thuộc tính <code>float: right</code>.</p>
        </div>
    </div>

</body>
</html>
