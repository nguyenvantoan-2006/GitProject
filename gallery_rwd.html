<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <!-- Liên kết file CSS -->
    <link rel="stylesheet" href="gallery_style.css">
</head>
<body>

    <h2>Thư Viện Ảnh Responsive (RWD Gallery)</h2>
    <p class="subtitle">Thay đổi kích thước cửa sổ trình duyệt để quan sát số lượng cột ảnh tự động điều chỉnh.</p>

    <div class="gallery-container">
        <!-- Ảnh 1 -->
        <div class="responsive">
            <div class="gallery">
                <a target="_blank" href="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80">
                    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80" alt="Cảnh quan thiên nhiên núi rừng">
                </a>
                <div class="desc">Thiên nhiên hùng vĩ</div>
            </div>
        </div>

        <!-- Ảnh 2 -->
        <div class="responsive">
            <div class="gallery">
                <a target="_blank" href="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80" alt="Bãi biển nhiệt đới cát trắng">
                </a>
                <div class="desc">Bãi biển trong xanh</div>
            </div>
        </div>

        <!-- Ảnh 3 -->
        <div class="responsive">
            <div class="gallery">
                <a target="_blank" href="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=80">
                    <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=600&q=80" alt="Sương mù trên ngọn núi sáng sớm">
                </a>
                <div class="desc">Bình minh mù sương</div>
            </div>
        </div>

        <!-- Ảnh 4 -->
        <div class="responsive">
            <div class="gallery">
                <a target="_blank" href="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80">
                    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=600&q=80" alt="Khu rừng mùa thu ngập nắng">
                </a>
                <div class="desc">Rừng cây rực rỡ</div>
            </div>
        </div>
    </div>

</body>
</html>
