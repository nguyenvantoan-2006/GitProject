<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Form Tìm kiếm Google</title>
</head>
<body>

    <h2>Tìm kiếm với Google</h2>
    
    <!-- Form gửi dữ liệu sang Google bằng phương thức GET -->
    <form action="https://www.google.com.vn/search" method="GET">
        <input type="text" name="q" placeholder="Nhập từ khóa cần tìm..." required />
        <input type="submit" value="Tìm kiếm" />
    </form>

</body>
</html>
