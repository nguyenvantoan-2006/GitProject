<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo liên kết trong HTML</title>
</head>
<body>

    <!-- Tiêu đề chính -->
    <h1>Liên kết yêu thích của tôi</h1>

    <!-- Danh sách không có thứ tự chứa ít nhất 3 liên kết -->
    <ul>
        <li>
            <!-- Liên kết mở tab mới (target="_blank") -->
            <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">Google (Mở tab mới)</a>
        </li>
        <li>
            <a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
        </li>
        <li>
            <a href="https://codegym.vn" target="_blank" rel="noopener noreferrer">CodeGym Việt Nam</a>
        </li>
        <li>
            <!-- Liên kết đến file HTML khác trong cùng thư mục -->
            <a href="about.html">Xem trang Giới thiệu (about.html)</a>
        </li>
        <li>
            <!-- Liên kết gửi email qua mailto: -->
            <a href="mailto:example@gmail.com">Gửi thư cho tôi (mailto)</a>
        </li>
    </ul>

</body>
</html>
