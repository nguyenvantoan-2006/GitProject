<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
</head>
<body>

    <!-- Tiêu đề h1 theo yêu cầu -->
    <h1>Danh sách sản phẩm</h1>

    <!-- Bảng sản phẩm gồm 3 cột: Tên sản phẩm, Giá, Số lượng -->
    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Laptop Dell XPS 13</td>
                <td>28.500.000 VNĐ</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Chuột không dây Logitech</td>
                <td>450.000 VNĐ</td>
                <td>25</td>
            </tr>
            <tr>
                <td>Bàn phím cơ DareU</td>
                <td>750.000 VNĐ</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Tai nghe Sony WH-1000XM4</td>
                <td>6.200.000 VNĐ</td>
                <td>8</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
