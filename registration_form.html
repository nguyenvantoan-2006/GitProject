<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành tạo Form HTML</title>
    <style>
        body {
            font-family: Arial, "Helvetica Neue", sans-serif;
            line-height: 1.6;
            background-color: #f4f6f8;
            padding: 20px;
            color: #333;
        }
        .form-container {
            background-color: #ffffff;
            max-width: 650px;
            margin: 0 auto 30px auto;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label.field-label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }
        input[type="text"],
        input[type="email"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
        }
        .radio-group label,
        .checkbox-group label {
            margin-right: 18px;
            font-weight: normal;
            cursor: pointer;
        }
        .btn-group {
            margin-top: 20px;
        }
        input[type="submit"] {
            background-color: #3498db;
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        input[type="submit"]:hover {
            background-color: #2980b9;
        }
        input[type="reset"] {
            background-color: #e74c3c;
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="reset"]:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <!-- PHẦN 1: FORM ĐƠN GIẢN -->
    <div class="form-container">
        <h2>Phần 1: Form Khảo Sát Đơn Giản</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label class="field-label" for="p1_name">Họ và tên:</label>
                <input type="text" id="p1_name" name="yourname" placeholder="Nhập họ và tên..." required>
            </div>

            <div class="form-group">
                <label class="field-label" for="p1_email">Email:</label>
                <input type="email" id="p1_email" name="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group checkbox-group">
                <label class="field-label">Sở thích:</label>
                <label><input type="checkbox" name="hobby" value="reading"> Đọc sách</label>
                <label><input type="checkbox" name="hobby" value="travel"> Du lịch</label>
                <label><input type="checkbox" name="hobby" value="music"> Nghe nhạc</label>
                <label><input type="checkbox" name="hobby" value="gaming"> Chơi game</label>
            </div>

            <div class="btn-group">
                <input type="submit" value="Gửi thông tin">
                <input type="reset" value="Nhập lại">
            </div>
        </form>
    </div>

    <!-- PHẦN 2: TẠO FORM ĐĂNG KÝ HỌC VIÊN -->
    <div class="form-container">
        <h2>Phần 2: Form Đăng Ký Học Viên</h2>
        <form action="#" method="POST">
            <!-- Họ và tên -->
            <div class="form-group">
                <label class="field-label" for="p2_fullname">Họ và tên:</label>
                <input type="text" id="p2_fullname" name="fullname" placeholder="Nguyễn Văn A" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label class="field-label" for="p2_email">Email:</label>
                <input type="email" id="p2_email" name="email" placeholder="student@example.com" required>
            </div>

            <!-- Số điện thoại -->
            <div class="form-group">
                <label class="field-label" for="p2_phone">Số điện thoại:</label>
                <input type="text" id="p2_phone" name="phone" placeholder="0912345678" required>
            </div>

            <!-- Ngày sinh -->
            <div class="form-group">
                <label class="field-label" for="p2_birthday">Ngày sinh:</label>
                <input type="date" id="p2_birthday" name="birthday">
            </div>

            <!-- Giới tính -->
            <div class="form-group radio-group">
                <label class="field-label">Giới tính:</label>
                <label><input type="radio" name="gender" value="male" checked> Nam</label>
                <label><input type="radio" name="gender" value="female"> Nữ</label>
                <label><input type="radio" name="gender" value="other"> Khác</label>
            </div>

            <!-- Địa chỉ -->
            <div class="form-group">
                <label class="field-label" for="p2_address">Địa chỉ:</label>
                <textarea id="p2_address" name="address" rows="3" placeholder="Nhập địa chỉ cư trú..."></textarea>
            </div>

            <!-- Khóa học -->
            <div class="form-group">
                <label class="field-label" for="p2_course">Khóa học đăng ký:</label>
                <select id="p2_course" name="course">
                    <option value="html_css">HTML & CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                </select>
            </div>

            <!-- Hình thức học -->
            <div class="form-group radio-group">
                <label class="field-label">Hình thức học:</label>
                <label><input type="radio" name="study_type" value="online" checked> Online</label>
                <label><input type="radio" name="study_type" value="offline"> Offline</label>
            </div>

            <!-- Sở thích -->
            <div class="form-group checkbox-group">
                <label class="field-label">Sở thích:</label>
                <label><input type="checkbox" name="hobby" value="coding"> Lập trình</label>
                <label><input type="checkbox" name="hobby" value="sports"> Thể thao</label>
                <label><input type="checkbox" name="hobby" value="music"> Âm nhạc</label>
                <label><input type="checkbox" name="hobby" value="reading"> Đọc sách</label>
            </div>

            <!-- Ghi chú -->
            <div class="form-group">
                <label class="field-label" for="p2_note">Ghi chú thêm:</label>
                <textarea id="p2_note" name="note" rows="3" placeholder="Yêu cầu hoặc thắc mắc cá nhân..."></textarea>
            </div>

            <!-- Các nút hành động -->
            <div class="btn-group">
                <input type="submit" value="Đăng ký">
                <input type="reset" value="Nhập lại">
            </div>
        </form>
    </div>

</body>
</html>
