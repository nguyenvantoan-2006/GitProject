<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Responsive grid</title>
    <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <div class="grid-demo">
      <div class="gridcontainer">
        <div class="gridwrapper gridwrapper--top">
          <div class="gridcontent gridcontent--full gridcontent--purple"></div>
        </div>
        <div class="gridwrapper gridwrapper--middle">
          <div class="gridcontent gridcontent--white gridcontent--sidebar">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
          <div class="gridcontent gridcontent--white"></div>
          <div class="gridcontent gridcontent--white"></div>
          <div class="gridcontent gridcontent--white"></div>
          <div class="gridcontent gridcontent--white"></div>
          <div class="gridcontent gridcontent--white"></div>
          <div class="gridcontent gridcontent--white"></div>
          <div class="gridcontent gridcontent--white gridcontent--sidebar">
            <div class="grid-cell grid-cell--fill"></div>
          </div>
        </div>
        <div class="gridwrapper gridwrapper--footer">
          <div class="gridcontent gridcontent--full gridcontent--blue"></div>
        </div>
      </div>
    </div>

    <div class="gridcontainer gridcontainer--guide">
      <div class="gridwrapper gridwrapper--guide">
        <div class="gridcontent gridcontent--guide gridcontent--guide-first"></div>
        <div class="gridcontent gridcontent--guide"></div>
        <div class="gridcontent gridcontent--guide"></div>
        <div class="gridcontent gridcontent--guide"></div>
        <div class="gridcontent gridcontent--guide"></div>
        <div class="gridcontent gridcontent--guide"></div>
        <div class="gridcontent gridcontent--guide"></div>
        <div class="gridcontent gridcontent--guide"></div>
        <div class="gridcontent gridcontent--guide"></div>
        <div class="gridcontent gridcontent--guide"></div>
        <div class="gridcontent gridcontent--guide"></div>
        <div class="gridcontent gridcontent--guide"></div>
      </div>
    </div>

    <p>Resize the browser window to see that this grid will respond to the resizing, and always use 100% of the available space.</p>
  </body>
</html>
