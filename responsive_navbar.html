<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Responsive Navbar</title>
    <!-- Liên kết tới CSS và JS -->
    <link rel="stylesheet" href="style_navbar.css">
    <script defer src="script_navbar.js"></script>
</head>
<body>

    <!-- Thanh điều hướng responsive -->
    <nav class="navbar">
        <div class="logo">MyWebsite</div>
        <ul class="nav-links">
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Dịch vụ</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
        <div class="menu-icon">☰</div>
    </nav>

    <!-- Khối nội dung minh họa -->
    <main style="padding: 40px 20px; text-align: center; color: #334155;">
        <h1>Chào mừng đến với trang web</h1>
        <p style="margin-top: 15px; font-size: 16px;">
            Hãy thu nhỏ cửa sổ trình duyệt (hoặc ấn <strong>F12</strong> chọn chế độ thiết bị di động) để kiểm tra biểu tượng ☰ và bấm vào để mở/đóng menu.
        </p>
    </main>

</body>
</html>
